name: Release

# Pushing a tag vX.Y.Z (matching RIG_VERSION) on a commit of main publishes that release: rig and rigd for Apple Silicon
# and Intel Macs, the install script, SHA256SUMS, and a build provenance attestation for each file. Nothing is published
# unless the tagged commit passes all of CI, which also builds the release and tries it on both architectures; the files
# published are the ones CI tried. Re-running a tag is safe: a draft an interrupted run left is replaced, and a release
# already published is left as it is. See "Releasing" in README.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One run per tag at a time, so two runs never publish the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Tagged commit is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::$GITHUB_REF_NAME tags $(git rev-parse HEAD), which is not on main. Tag a commit of main."
            exit 1
          }

  checks:
    name: CI
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      tag: ${{ github.ref_name }}

  publish:
    name: Attest and publish
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only this job can write: attestations, and the release.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.ref_name }}
          path: dist
      # `published` when a run before this one already published the tag: nothing more is done, and nothing is replaced.
      - id: state
        run: |
          state="$(bun scripts/publish-release.ts status "$TAG" dist)"
          echo "state=$state" >>"$GITHUB_OUTPUT"
          [ "$state" = publish ] || echo "::notice::$TAG is already published; it was left as it is."
      - if: steps.state.outputs.state == 'publish'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/install
            dist/SHA256SUMS
      - if: steps.state.outputs.state == 'publish'
        run: bun scripts/publish-release.ts publish "$TAG" dist
