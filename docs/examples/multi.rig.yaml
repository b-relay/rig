# yaml-language-server: $schema=../../schemas/rig.schema.json
# tests/config-examples-e2e.test.ts validates this file.
# These example programs use ordinary application-defined environment inputs.
name: acme
domain: acme.example.com
build: bun install --frozen-lockfile

environment:
  LOG_FORMAT: json

services:
  web:
    # The web app lives in apps/web: its build and command run there.
    working_dir: apps/web
    build: bun run build
    command: bun dist/server.js
    ports: { http: auto }
    environment:
      HOST: 127.0.0.1
      PORT: ${port}
    ready: http://127.0.0.1:${port}/health
    depends_on: [api]

  api:
    build: go build -o .rig-build/api ./cmd/api
    command: ./.rig-build/api
    ports: { http: auto }
    environment:
      HOST: 127.0.0.1
      PORT: ${port}
      DATA_DIR: ${rig.data}
      DATABASE_URL: postgres://postgres@127.0.0.1:${services.db.port}/postgres
    env_file: ~/.rig/env/acme/api-secrets.env
    ready: http://127.0.0.1:${port}/health
    depends_on: [db]

  db:
    command: >-
      test -s "$PGDATA/PG_VERSION" || initdb -D "$PGDATA" -U postgres --auth=trust || exit $?;
      exec postgres -D "$PGDATA" -h "$PGHOST" -p "$PGPORT"
    ports: { pg: auto }
    environment:
      PGHOST: 127.0.0.1
      PGPORT: ${port}
      PGDATA: ${rig.data}/pg
    ready: pg_isready -h 127.0.0.1 -p ${port}

tools:
  acmectl:
    build: go build -o .rig-build/acmectl ./cmd/acmectl
    bin: .rig-build/acmectl

# Two Services declare ports, so the proxy names which one serves each path.
proxy:
  /api: api
  /: web

targets:
  working:
    environment: { LOG_FORMAT: pretty }
    services:
      api:
        ports: { http: 8787 }
      # The working Target runs the dev server instead of a build.
      web:
        build: false
        command: bun run dev --port ${port}
  stable: true
  preview:
    domain: ${rig.target}.preview.acme.example.com
