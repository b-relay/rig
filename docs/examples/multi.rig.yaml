# yaml-language-server: $schema=../../schemas/rig.schema.json
# tests/config-examples-e2e.test.ts validates this file.
# These example programs use ordinary application-defined environment inputs.
name: acme
production_branch: main
domain: acme.example.com
build: bun install --frozen-lockfile

environment:
  LOG_FORMAT: json

services:
  web:
    build: bun run build:web
    command: bun apps/web/dist/server.js
    ports: { http: auto }
    environment:
      HOST: 127.0.0.1
      PORT: ${services.web.ports.http}
    ready: http://127.0.0.1:${services.web.ports.http}/health
    depends_on: [api]

  api:
    build: go build -o .rig-build/api ./cmd/api
    command: ./.rig-build/api
    ports: { http: auto }
    environment:
      HOST: 127.0.0.1
      PORT: ${services.api.ports.http}
      DATA_DIR: ${rig.data}
      DATABASE_URL: postgres://postgres@127.0.0.1:${services.db.ports.pg}/postgres
    env_file: ~/.rig/env/acme/api-secrets.env
    ready: http://127.0.0.1:${services.api.ports.http}/health
    depends_on: [db]

  db:
    command: >-
      test -s "$PGDATA/PG_VERSION" || initdb -D "$PGDATA" -U postgres --auth=trust || exit $?;
      exec postgres -D "$PGDATA" -h "$PGHOST" -p "$PGPORT"
    ports: { pg: auto }
    environment:
      PGHOST: 127.0.0.1
      PGPORT: ${services.db.ports.pg}
      PGDATA: ${rig.data}/pg
    ready: pg_isready -h ${services.db.environment.PGHOST} -p ${services.db.ports.pg}

tools:
  acmectl:
    build: go build -o .rig-build/acmectl ./cmd/acmectl
    bin: .rig-build/acmectl

proxy:
  /api: ${services.api.ports.http}
  /: ${services.web.ports.http}

targets:
  working:
    services:
      api:
        ports: { http: 8787 }
    environment: { LOG_FORMAT: pretty }
  stable: true
  preview:
    domain: ${rig.target}.preview.acme.example.com
