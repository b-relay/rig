name: rig
description: Rig project config for the CLI and daemon binaries and the Rig dashboard site.
# Each Preview gets rig-<preview>.b-relay.com from this; web is the one Service with a port, so the hostname routes to
# it without a proxy. rig.b-relay.com itself is the installed Rig's dashboard (dashboard.domain in Host config): an
# installed release is production, so this repository runs no stable Target and publishes no rig or rigd of its own.
domain: rig.b-relay.com

services:
  # The dashboard: a Next.js site rendered on the server under Bun. Its pages read this Host's
  # rigd with the control-plane address and token from the Rig root, the way rig does, so the
  # browser never holds them.
  web:
    # The same assembled build a release ships and rigd runs (scripts/build-dashboard.sh), so what runs here is what ships.
    build: bun install --frozen-lockfile && rm -rf .dashboard && scripts/build-dashboard.sh .dashboard
    command: bun .dashboard/web/server.js
    ports: { http: auto }
    environment:
      PORT: ${port}
      HOSTNAME: 127.0.0.1
      # The checkout the site was built from: the assembled server runs from inside .dashboard/web, and a Preview's
      # sandbox rig and rigd run from this checkout's sources.
      RIG_WEB_REPOSITORY: ${rig.workspace}
      # The site owns SIGTERM so a stop can take the sandbox rigd of a Preview down with it.
      NEXT_MANUAL_SIG_HANDLE: "true"
      # The name this Target is published under; empty for the working Target, which is loopback only.
      RIG_WEB_HOST: ${rig.host}
      RIG_WEB_DASHBOARD_HOST: rig.b-relay.com
      # Browsers beyond this Mac sign in with the key in this file; the Service creates it on first start.
      RIG_WEB_KEY_FILE: ${rig.data}/access.key
    healthcheck:
      test: http://127.0.0.1:${port}/healthz

targets:
  # The working copy is how Rig is developed and tried: its Tools are rig-dev and rigd-dev, beside the installed ones.
  working: true
  stable: false
  preview:
    services:
      web:
        environment:
          # A Preview's dashboard drives a throwaway rigd of its own, kept in the Preview's data
          # directory and destroyed with it, so an unreviewed Branch never holds the Host's rigd.
          RIG_WEB_SANDBOX_ROOT: ${rig.data}/rigd
          # rig.b-relay.com resolves to this Mac's Tailscale address, so browsers reach Caddy from the tailnet.
          RIG_WEB_TRUSTED_CLIENTS: 100.64.0.0/10

tools:
  rig:
    build: bun install --frozen-lockfile && bun build --compile --define "process.env.RIG_BUILD_COMMIT=\"$(git describe --always --dirty --abbrev=12 --exclude='*' 2>/dev/null || echo dev)\"" src/index.ts --outfile rig
    bin: rig
  rigd:
    build: bun install --frozen-lockfile && bun build --compile --define "process.env.RIG_BUILD_COMMIT=\"$(git describe --always --dirty --abbrev=12 --exclude='*' 2>/dev/null || echo dev)\"" src/rigd.ts --outfile rigd
    bin: rigd
