name: rig
description: Rig project config for the CLI, daemon, Git remote helper binaries, and the Rig dashboard site.
production_branch: main
# The Stable Target serves the website here; each Preview gets <preview>.rig.b-relay.com.
domain: rig.b-relay.com

services:
  # The dashboard: a Next.js site rendered on the server under Bun. Its pages read this Host's
  # rigd with the control-plane address and token from the Rig root, the way rig does, so the
  # browser never holds them.
  web:
    build: bun install --frozen-lockfile && bun --bun next build web
    run: bun --bun next start web -H 127.0.0.1 -p ${services.web.ports.http}
    ports: { http: auto }
    env:
      PORT: ${services.web.ports.http}
      # The site owns SIGTERM so a stop can take the sandbox rigd of a Preview down with it.
      NEXT_MANUAL_SIG_HANDLE: "true"
      # The name this Target is published under; empty for the Working copy, which is loopback only.
      RIG_WEB_HOST: ${rig.host}
      RIG_WEB_DASHBOARD_HOST: rig.b-relay.com
      # Browsers beyond this Mac sign in with the key in this file; the Service creates it on first start.
      RIG_WEB_KEY_FILE: ${rig.data}/access.key
    ready: http://127.0.0.1:${services.web.ports.http}/healthz

proxy:
  /: ${services.web.ports.http}

targets:
  preview:
    services:
      web:
        env:
          # A Preview's dashboard drives a throwaway rigd of its own, kept in the Preview's data
          # directory and destroyed with it, so an unreviewed Branch never holds the Host's rigd.
          RIG_WEB_SANDBOX_ROOT: ${rig.data}/rigd
          # rig.b-relay.com resolves to this Mac's Tailscale address, so browsers reach Caddy from the tailnet.
          RIG_WEB_TRUSTED_CLIENTS: 100.64.0.0/10

tools:
  rig:
    build: bun install --frozen-lockfile && bun build --compile --define "process.env.RIG_BUILD_COMMIT=\"$(git describe --always --dirty --abbrev=12 --exclude='*' 2>/dev/null || echo dev)\"" src/index.ts --outfile rig
    bin: rig
  rigd:
    build: bun install --frozen-lockfile && bun build --compile --define "process.env.RIG_BUILD_COMMIT=\"$(git describe --always --dirty --abbrev=12 --exclude='*' 2>/dev/null || echo dev)\"" src/rigd.ts --outfile rigd
    bin: rigd
  git-remote-rig:
    build: bun install --frozen-lockfile && bun build --compile --define "process.env.RIG_BUILD_COMMIT=\"$(git describe --always --dirty --abbrev=12 --exclude='*' 2>/dev/null || echo dev)\"" src/git/remote-helper.ts --outfile git-remote-rig
    bin: git-remote-rig
