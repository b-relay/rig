name: rig
description: Rig project config for the CLI, daemon, Git remote helper binaries, and the Rig website.
production_branch: main
# The Stable Target serves the website here; each Preview gets <preview>.rig.b-relay.com.
domain: rig.b-relay.com

services:
  # The landing page, the dashboard, and the relay to this Host's rigd. The relay reads the
  # control-plane address and token from the Rig root the way rig does, so the browser never holds them.
  web:
    build: bun install --frozen-lockfile
    run: bun web/server/main.ts
    ports: { http: auto }
    env:
      PORT: ${services.web.ports.http}
      # The name this Target is published under; empty for the Working copy, which is loopback only.
      RIG_WEB_HOST: ${rig.host}
      RIG_WEB_DASHBOARD_HOST: rig.b-relay.com
      # Browsers beyond this Mac sign in with the key in this file; the Service creates it on first start.
      RIG_WEB_KEY_FILE: ${rig.data}/access.key
    ready: http://127.0.0.1:${services.web.ports.http}/healthz

proxy:
  /: ${services.web.ports.http}

targets:
  preview:
    services:
      web:
        env:
          # A Preview's dashboard drives a throwaway rigd of its own, kept in the Preview's data
          # directory and destroyed with it, so an unreviewed Branch never holds the Host's rigd.
          RIG_WEB_SANDBOX_ROOT: ${rig.data}/rigd
          # rig.b-relay.com resolves to this Mac's Tailscale address, so browsers reach Caddy from the tailnet.
          RIG_WEB_TRUSTED_CLIENTS: 100.64.0.0/10

tools:
  rig:
    build: bun install --frozen-lockfile && bun build --compile src/index.ts --outfile rig
    bin: rig
  rigd:
    build: bun install --frozen-lockfile && bun build --compile src/rigd.ts --outfile rigd
    bin: rigd
  git-remote-rig:
    build: bun install --frozen-lockfile && bun build --compile src/git/remote-helper.ts --outfile git-remote-rig
    bin: git-remote-rig
