name: ledger
description: Demo Project. An API with a background worker that waits for it.
domain: ledger.test

services:
  api:
    command: bun api.ts
    ports: { http: auto }
    environment:
      PORT: ${port}
    healthcheck:
      test: http://127.0.0.1:${port}/healthz
  worker:
    command: bun worker.ts
    depends_on: [api]
    environment:
      API_URL: http://127.0.0.1:${services.api.port}

# A nightly job, so the dashboard's Jobs rows and tab have something to show.
jobs:
  close-books:
    command: bun close.ts
    schedule: "0 2 * * *"
    environment:
      API_URL: http://127.0.0.1:${services.api.port}
  # A backup job, so the Jobs tab shows backups, Back up now and Restore.
  books-backup:
    command: curl -fsS http://127.0.0.1:${services.api.port}/healthz > "$RIG_BACKUP_DIR/books.json"
    schedule: "30 2 * * *"
    backup:
      keep: 7
      restore: cat "$RIG_BACKUP_DIR/books.json"

# The seed deploys the stable Target, so it is on.
targets:
  working: true
  stable: true
