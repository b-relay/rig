name: pantry
description: Demo Project. A household inventory site with one web Service.
production_branch: main
domain: pantry.test

environment:
  LOG_LEVEL: info

services:
  web:
    command: bun server.ts
    ports: { http: auto }
    environment:
      PORT: ${services.web.ports.http}
      GREETING: The pantry is stocked.
    ready: http://127.0.0.1:${services.web.ports.http}/healthz

proxy:
  /: ${services.web.ports.http}

# The seed deploys the stable Target and a Preview, so both are on.
targets:
  working: true
  stable: true
  preview: true
